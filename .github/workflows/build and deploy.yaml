name: Build and deploy
on:
  push:
    branches:
      - uat-server

env:
  DEPLOYMENT_SERVER_IP: ${{ secrets.INSTANCE_IP }}
  DEPLOYMENT_SERVER_KEY: ${{ secrets.INSTANCE_RSA_KEY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/simple-node-app:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/simple-node-app:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - name: Transfer docker compose to vm
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOYMENT_SERVER_IP }}
          username: ec2-user
          key: ${{ env.DEPLOYMENT_SERVER_KEY }}
          source: "docker-compose.production.yaml,nginx.conf"
          target: "~/"

      - name: Deply nodeapp using docker compose
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ env.DEPLOYMENT_SERVER_IP }}
          username: ec2-user
          key: ${{ env.DEPLOYMENT_SERVER_KEY }}
          script: |
            export COMMIT_HASH=${{github.sha}}
            docker-compose -f docker-compose.production.yaml up -d
